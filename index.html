<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>移动端 SoC 综合性能天梯榜 (SoC Benchmark Chart)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-grad: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      --apple: #a855f7;
      --qualcomm: #ef4444;
      --mediatek: #f59e0b;
      --hisilicon: #ec4899;
      --samsung: #3b82f6;
      --google: #10b981;
      --xiaomi: #f97316;
      --other: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
    }

    /* Formula Banner */
    .formula-banner {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      backdrop-filter: blur(12px);
    }

    .formula-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .formula-tag b {
      color: var(--accent);
    }

    /* Control Panel */
    .controls {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(12px);
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 240px;
    }

    .search-box input {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .filter-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }

    .sort-group {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .sort-select {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    /* Ranking List / Table */
    .list-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chip-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 18px;
      display: grid;
      grid-template-columns: 44px 2.2fr 3.5fr 1fr;
      align-items: center;
      gap: 16px;
      transition: transform 0.15s ease, border-color 0.2s ease;
      backdrop-filter: blur(8px);
      cursor: pointer;
    }

    .chip-card:hover {
      transform: translateX(3px);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .chip-card.baseline {
      border: 1px solid rgba(236, 72, 153, 0.6);
      background: rgba(236, 72, 153, 0.08);
    }

    .rank-num {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-muted);
      text-align: center;
    }

    .rank-1 { color: #fbbf24; }
    .rank-2 { color: #94a3b8; }
    .rank-3 { color: #b45309; }

    .chip-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .chip-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip-name {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .brand-Apple { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .brand-Qualcomm { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .brand-MediaTek { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .brand-HiSilicon { background: rgba(236, 72, 153, 0.2); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.3); }
    .brand-Samsung { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .brand-Google { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .brand-Xiaomi { background: rgba(249, 115, 22, 0.2); color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.3); }
    .brand-Other { background: rgba(100, 116, 139, 0.2); color: #94a3b8; border: 1px solid rgba(100, 116, 139, 0.3); }

    .chip-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
    }

    /* Bars */
    .bars-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .bar-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
    }

    .bar-label {
      width: 46px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .bar-track {
      flex: 1;
      height: 7px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .bar-fill.overall { background: var(--accent-grad); }
    .bar-fill.cpu { background: linear-gradient(90deg, #38bdf8, #2563eb); }
    .bar-fill.gpu { background: linear-gradient(90deg, #ec4899, #f43f5e); }

    .bar-val {
      width: 42px;
      text-align: right;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Score Column */
    .score-box {
      text-align: right;
    }

    .score-main {
      font-size: 22px;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }

    .score-unit {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Drawer / Details */
    .chip-drawer {
      grid-column: 1 / -1;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 12px;
      margin-top: 6px;
      display: none;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .chip-card.expanded .chip-drawer {
      display: block;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .detail-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 8px 12px;
    }

    .detail-card strong {
      color: var(--text-main);
      display: block;
      margin-bottom: 2px;
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px 0;
      color: var(--text-muted);
      font-size: 13px;
      border-top: 1px solid var(--card-border);
    }

    @media (max-width: 768px) {
      .chip-card {
        grid-template-columns: 32px 1fr 70px;
        gap: 10px;
      }
      .bars-container {
        grid-column: 1 / -1;
        order: 3;
      }
      .score-main {
        font-size: 18px;
      }
    }
  </style>
</head>

"brand": "Qualcomm", "year": 2020, "process": "8nm", "gpu": "Adreno 619", "gb6s": 601, "gb6m": 1882, "cpu_score": 51.9, "wle_raw": 333, "snl_raw": null, "wle_equiv": 333.0, "gpu_method": "wle_direct", "gpu_score": 16.1, "overall": 37.6, "name_cn": "骁龙 750G", "brand_cn": "高通"}, {"id": "qualcomm-snapdragon-730", "name": "Qualcomm Snapdragon 730", "brand": "Qualcomm", "year": 2019, "process": "8nm", "gpu": "Adreno 618", "gb6s": 724, "gb6m": 1836, "cpu_score": 53.9, "wle_raw": 269, "snl_raw": null, "wle_equiv": 269.0, "gpu_method": "wle_direct", "gpu_score": 13.0, "overall": 37.5, "name_cn": "骁龙 730", "brand_cn": "高通"}];

    let currentFilter = 'all';
    let currentSort = 'overall';
    let searchQuery = '';

    const listContainer = document.getElementById('chipList');
    const searchInput = document.getElementById('searchInput');
    const brandFilters = document.getElementById('brandFilters');
    const sortSelect = document.getElementById('sortSelect');

    function renderList() {
      const maxOverall = Math.max(...CHIPS_DATA.map(c => c.overall));
      const maxCPU = Math.max(...CHIPS_DATA.map(c => c.cpu_score));
      const maxGPU = Math.max(...CHIPS_DATA.map(c => c.gpu_score));

      // 过滤
      let filtered = CHIPS_DATA.filter(chip => {
        const matchBrand = (currentFilter === 'all') || (chip.brand === currentFilter);
        const q = searchQuery.trim().toLowerCase();
        const matchSearch = !q || 
          chip.name_cn.toLowerCase().includes(q) || 
          chip.name.toLowerCase().includes(q) || 
          chip.brand_cn.toLowerCase().includes(q) ||
          chip.brand.toLowerCase().includes(q) ||
          (chip.gpu && chip.gpu.toLowerCase().includes(q));
        return matchBrand && matchSearch;
      });

      // 排序
      filtered.sort((a, b) => {
        if (currentSort === 'overall') return b.overall - a.overall;
        if (currentSort === 'cpu') return b.cpu_score - a.cpu_score;
        if (currentSort === 'gpu') return b.gpu_score - a.gpu_score;
        if (currentSort === 'gb6s') return b.gb6s - a.gb6s;
        if (currentSort === 'gb6m') return b.gb6m - a.gb6m;
        return 0;
      });

      listContainer.innerHTML = '';

      if (filtered.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">未找到符合条件的芯片</div>';
        return;
      }

      filtered.forEach((chip, index) => {
        const isBaseline = chip.name.includes("Kirin 9000") && !chip.name.includes("9000S");
        const rankClass = index === 0 ? 'rank-1' : (index === 1 ? 'rank-2' : (index === 2 ? 'rank-3' : ''));
        
        const card = document.createElement('div');
        card.className = `chip-card ${isBaseline ? 'baseline' : ''}`;
        card.innerHTML = `
          <div class="rank-num ${rankClass}">${index + 1}</div>
          <div class="chip-info">
            <div class="chip-name-row">
              <span class="chip-name" title="${chip.name_cn} (${chip.name})">${chip.name_cn}</span>
              <span class="brand-badge brand-${chip.brand}">${chip.brand_cn}</span>
              ${isBaseline ? '<span style="font-size:10px; background:#ec4899; color:#fff; padding:1px 5px; border-radius:3px; font-weight:bold;">100基准</span>' : ''}
            </div>
            <div class="chip-meta">
              <span>${chip.process || '工艺未知'}</span>
              <span>•</span>
              <span>${chip.gpu || 'GPU 未知'}</span>
              ${chip.year ? `<span>•</span><span>${chip.year}年</span>` : ''}
            </div>
          </div>
          <div class="bars-container">
            <div class="bar-item">
              <span class="bar-label">综合</span>
              <div class="bar-track">
                <div class="bar-fill overall" style="width: ${(chip.overall / maxOverall * 100).toFixed(1)}%"></div>
              </div>
              <span class="bar-val">${chip.overall.toFixed(1)}</span>
            </div>
            <div class="bar-item">
              <span class="bar-label">CPU</span>
              <div class="bar-track">
                <div class="bar-fill cpu" style="width: ${(chip.cpu_score / maxCPU * 100).toFixed(1)}%"></div>
              </div>
              <span class="bar-val">${chip.cpu_score.toFixed(1)}</span>
            </div>
            <div class="bar-item">
              <span class="bar-label">GPU</span>
              <div class="bar-track">
                <div class="bar-fill gpu" style="width: ${(chip.gpu_score / maxGPU * 100).toFixed(1)}%"></div>
              </div>
              <span class="bar-val">${chip.gpu_score.toFixed(1)}</span>
            </div>
          </div>
          <div class="score-box">
            <div class="score-main">${chip.overall.toFixed(1)}</div>
            <div class="score-unit">综合指数</div>
          </div>
          <div class="chip-drawer">
            <div class="detail-grid">
              <div class="detail-card">
                <strong>CPU Geekbench 6 详情</strong>
                单核: ${chip.gb6s} 分 · 多核: ${chip.gb6m} 分<br>
                CPU 归一化分: ${chip.cpu_score} 分
              </div>
              <div class="detail-card">
                <strong>GPU 图形测试详情</strong>
                ${chip.wle_raw ? `3DMark WLE 原生: ${chip.wle_raw} 分<br>` : ''}
                ${chip.snl_raw ? `3DMark Steel Nomad Light: ${chip.snl_raw} 分<br>` : ''}
                WLE 当量: ${Math.round(chip.wle_equiv)} 分 (${chip.gpu_method})<br>
                GPU 归一化分: ${chip.gpu_score} 分
              </div>
            </div>
          </div>
        `;

        card.addEventListener('click', () => {
          card.classList.toggle('expanded');
        });

        listContainer.appendChild(card);
      });
    }

    // 事件监听
    brandFilters.addEventListener('click', (e) => {
      if (e.target.classList.contains('filter-btn')) {
        brandFilters.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.brand;
        renderList();
      }
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderList();
    });

    sortSelect.addEventListener('change', (e) => {
      currentSort = e.target.value;
      renderList();
    });

    renderList();
  </script>
